PLG_TASK_INFORMANAGEMENT="Task - Informanagement news"
PLG_TASK_INFORMANAGEMENT_XML_DESCRIPTION="Imports the Informanagement tax news as Joomla articles. Set up a scheduled task in System → Scheduled Tasks."
PLG_TASK_INFORMANAGEMENT_TASK_IMPORT_TITLE="Import Informanagement news"
PLG_TASK_INFORMANAGEMENT_TASK_IMPORT_DESC="Fetches new and changed articles from the Informanagement feed."
