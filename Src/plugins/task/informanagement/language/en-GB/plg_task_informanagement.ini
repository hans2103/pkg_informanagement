PLG_TASK_INFORMANAGEMENT_NUMBER_LABEL="Number of articles"
PLG_TASK_INFORMANAGEMENT_NUMBER_DESC="How many of the newest articles are checked per run (500 at most). Unchanged articles cost no extra request."
PLG_TASK_INFORMANAGEMENT_NOTIFY_AFTER_LABEL="Report after failed runs"
PLG_TASK_INFORMANAGEMENT_NOTIFY_AFTER_DESC="When Informanagement can't be reached, the task only counts as failed (and the failure mail is sent) after this many failed runs in a row. Before that, only a warning is logged. 1: report every failed run."
PLG_TASK_INFORMANAGEMENT_CATID_LABEL="Category"
PLG_TASK_INFORMANAGEMENT_CATID_DESC="Category for the news, for example News."
PLG_TASK_INFORMANAGEMENT_SUBCATEGORIES_LABEL="Subcategory per section"
PLG_TASK_INFORMANAGEMENT_SUBCATEGORIES_DESC="Puts each article in a subcategory named after its Informanagement section (Income tax, VAT …). A missing subcategory is created."
PLG_TASK_INFORMANAGEMENT_CREATED_BY_LABEL="Author"
PLG_TASK_INFORMANAGEMENT_CREATED_BY_DESC="Author of new articles. Empty: the first Super User."
PLG_TASK_INFORMANAGEMENT_UPDATE_LABEL="Update articles"
PLG_TASK_INFORMANAGEMENT_UPDATE_DESC="Updates an article when Informanagement changes it or publishes a revised version. The article's address stays the same."
PLG_TASK_INFORMANAGEMENT_KEEP_EDITS_LABEL="Keep own edits"
PLG_TASK_INFORMANAGEMENT_KEEP_EDITS_DESC="An article edited in Joomla is no longer overwritten by the feed."
PLG_TASK_INFORMANAGEMENT_IMAGES_LABEL="Fetch images"
PLG_TASK_INFORMANAGEMENT_IMAGES_DESC="Stores the image once in images/informanagement and uses it as intro and full article image."
PLG_TASK_INFORMANAGEMENT_IMAGE_WIDTH_LABEL="Image width (px)"
PLG_TASK_INFORMANAGEMENT_IMAGE_WIDTH_DESC="Informanagement delivers the image at this width."
PLG_TASK_INFORMANAGEMENT_IMAGE_JPEG_LABEL="Fetch as JPEG"
PLG_TASK_INFORMANAGEMENT_IMAGE_JPEG_DESC="Lets Informanagement deliver the image as JPEG (quality 80). A 2.8 MB PNG illustration becomes about 200 kB. Switch off if you need transparent images."
PLG_TASK_INFORMANAGEMENT_SOURCE_LABEL="Source line"
PLG_TASK_INFORMANAGEMENT_SOURCE_DESC="Adds the source below the article, such as 'Source: Ministry of Finance | bill | 12-11-2026'."
